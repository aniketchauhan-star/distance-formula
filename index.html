<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- The stylesheets and scripts below carry a version stamp, but the
     page itself has none to carry: a cached index.html hands the browser
     yesterday's stamps and so yesterday's css and js, which is what a
     change that "did not happen" usually turns out to be. -->
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Distance Formula — Swifty's Adventure</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css?v=20260915113849">
<link rel="stylesheet" href="css/number-selector.css?v=20260915113849">
<link rel="stylesheet" href="css/triangle-options.css?v=20260915113849">
</head>
<body>

<div id="viewport">
  <!-- 1920 x 1080 design space, scaled to fit any 16:9 screen -->
  <div id="stage">

    <!-- ============ loading ============ -->
    <div id="loader">
      <div class="loader-inner">
        <div class="loader-title">Distance Formula</div>
        <div class="loader-track"><div id="loaderBar"></div></div>
        <div id="loaderPct">0%</div>
      </div>
    </div>

    <!-- ============ start screen ============ -->
    <div id="startScreen" class="hidden">
      <img id="startArt" class="full" src="" alt="Distance Formula">

      <!-- wind and blowing leaves; behind her and behind the button -->
      <div id="startSky"></div>

      <!-- She flies in and perches on the rock before Play is offered.
           Her own rig rather than the game's: that one lives inside
           #scene, which is still hidden while this plays. -->
      <div id="startShadow"></div>
      <div id="startBird" class="pre-flight">
        <div id="startBirdWin">
          <img id="startFly"  src="" alt="">
          <img id="startTalk" src="" alt="Swifty">
        </div>
      </div>

      <button id="playBtn" class="veiled" disabled aria-label="Play">
        <img id="playImg" src="" alt="">
      </button>
    </div>

    <!-- ============ game scene ============ -->
    <div id="scene" class="hidden">
      <img id="sceneArt" class="full" src="" alt="">

      <div id="skyLayer"></div>

      <!-- screen 5: the coordinate board. Axes, arrowheads and numbers
           are drawn as an SVG overlay so each part can animate in. -->
      <div id="gridPanel" class="hidden">
        <div id="gridImg"></div>
        <svg id="gridAxes" aria-hidden="true"></svg>
      </div>

      <!-- bird + bubble share this group so they bob together and
           the tail never drifts off her head -->
      <div id="charGroup">
        <!-- she must not be seen standing at her mark before she flies
             in, so both start hidden until an entrance runs -->
        <div id="shadow" class="lifted"></div>
        <div id="birdRig" class="pre-entrance">
          <!-- mirrors her about the belly anchor so she faces the way
               she is travelling -->
          <div id="birdFlip">
            <div id="birdWin">
              <img id="flySheet"  src="" alt="">
              <img id="talkSheet" src="" alt="Swifty">
            </div>
          </div>
        </div>

        <!-- screen 5 resting pose, swapped in when she lands -->
        <img id="standSwifty" class="hidden" src="" alt="Swifty">

        <!-- The balloon, its catch-light, the two little strokes either
             side of it, and the tail that hangs off its bottom corner
             onto her head. The marks and the tail are the balloon's
             siblings, not its children, so seatBubble() can place them
             against the same box it sizes everything else from. -->
        <div id="bubble" class="hidden">
          <div id="bubbleImg"></div>
          <svg class="bub-mark mark-left" viewBox="0 0 40 60" aria-hidden="true">
            <path d="M8 12 L30 24" /><path d="M8 48 L30 36" />
          </svg>
          <svg class="bub-mark mark-right" viewBox="0 0 40 60" aria-hidden="true">
            <path d="M32 12 L10 24" /><path d="M32 48 L10 36" />
          </svg>
          <!-- filled first, so it covers the balloon's border where the
               two meet, then stroked along its two free edges only -->
          <svg id="bubbleTail" viewBox="0 -8 44 42" aria-hidden="true">
            <path class="tail-fill"   d="M4 -8 H42 V0 C36 12 24 22 2 34 C8 24 8 12 4 0 Z" />
            <path class="tail-stroke" d="M42 0 C36 12 24 22 2 34 C8 24 8 12 4 0" />
          </svg>
          <div id="bubbleText"><span id="bubbleLine"></span></div>
        </div>
      </div>


      <!-- screen 24: the formula stated beside the board -->
      <div id="formulaBoard" class="hidden"><div class="fb-inner"></div></div>

      <button id="nextBtn">Skip<span class="arrow">▶</span></button>

    </div>

    <!-- ============ effects ============ -->
    <!-- the hand that comes down and taps the point when nobody has
         moved for a while; positioned and shown by Hint -->
    <img id="nudge" class="hidden" src="" alt="">

    <div id="fxLayer"></div>
    <div id="leafLayer" class="hidden"></div>

  </div>
</div>

<script src="js/config.js?v=20260915113849"></script>
<script src="js/audio.js?v=20260915113849"></script>
<script src="js/fx.js?v=20260915113849"></script>
<script src="js/number-selector.js?v=20260915113849"></script>
<script src="js/triangle-options.js?v=20260915113849"></script>
<script src="js/game.js?v=20260915113849"></script>
</body>
</html>
