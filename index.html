<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- The stylesheets and scripts below carry a version stamp, but the
     page itself has none to carry: a cached index.html hands the browser
     yesterday's stamps and so yesterday's css and js, which is what a
     change that "did not happen" usually turns out to be. -->
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Distance Formula — Swifty's Adventure</title>

<!-- The game's own mark: two plotted points and the distance between
     them, in the board's navy and gold. The SVG scales to whatever a
     browser asks for; the PNGs are there for the ones that still want a
     bitmap, and for an iOS home screen. -->
<link rel="icon" type="image/svg+xml" href="assets/icon.svg?v=20260916170419">
<link rel="icon" type="image/png" sizes="32x32" href="assets/icon-32.png?v=20260916170419">
<link rel="apple-touch-icon" sizes="180x180" href="assets/icon-180.png?v=20260916170419">
<meta name="theme-color" content="#213258">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css?v=20260916170419">
<link rel="stylesheet" href="css/number-selector.css?v=20260916170419">
<link rel="stylesheet" href="css/triangle-options.css?v=20260916170419">
</head>
<body>

<div id="viewport">
  <!-- 1920 x 1080 design space, scaled to fit any 16:9 screen -->
  <div id="stage">

    <!-- ============ loading ============ -->
    <div id="loader">
      <div class="loader-inner">
        <div class="loader-title">Distance Formula</div>
        <div class="loader-track"><div id="loaderBar"></div></div>
        <div id="loaderPct">0%</div>
      </div>
    </div>

    <!-- ============ start screen ============ -->
    <div id="startScreen" class="hidden">
      <img id="startArt" class="full" src="" alt="Distance Formula">

      <!-- wind and blowing leaves; behind her and behind the button -->
      <div id="startSky"></div>

      <!-- She flies in and perches on the rock before Play is offered.
           Her own rig rather than the game's: that one lives inside
           #scene, which is still hidden while this plays. -->
      <div id="startShadow"></div>
      <div id="startBird" class="pre-flight">
        <div id="startBirdWin">
          <img id="startFly"  src="" alt="">
          <img id="startTalk" src="" alt="Swifty">
        </div>
      </div>

      <button id="playBtn" class="veiled" disabled aria-label="Play">
        <img id="playImg" src="" alt="">
      </button>
    </div>

    <!-- ============ game scene ============ -->
    <div id="scene" class="hidden">
      <img id="sceneArt" class="full" src="" alt="">

      <div id="skyLayer"></div>

      <!-- screen 5: the coordinate board. Axes, arrowheads and numbers
           are drawn as an SVG overlay so each part can animate in. -->
      <div id="gridPanel" class="hidden">
        <div id="gridImg"></div>
        <svg id="gridAxes" aria-hidden="true"></svg>
      </div>

      <!-- bird + bubble share this group so they bob together and
           the tail never drifts off her head -->
      <div id="charGroup">
        <!-- she must not be seen standing at her mark before she flies
             in, so both start hidden until an entrance runs -->
        <div id="shadow" class="lifted"></div>
        <div id="birdRig" class="pre-entrance">
          <!-- mirrors her about the belly anchor so she faces the way
               she is travelling -->
          <div id="birdFlip">
            <div id="birdWin">
              <img id="flySheet"  src="" alt="">
              <img id="talkSheet" src="" alt="Swifty">
            </div>
          </div>
        </div>

        <!-- screen 5 resting pose, swapped in when she lands -->
        <img id="standSwifty" class="hidden" src="" alt="Swifty">

        <!-- The balloon, its catch-light, and the tail that hangs off
             its bottom corner onto her head. The tail is the balloon's
             sibling, not its child, so seatBubble() can place it against
             the same box it sizes everything else from. -->
        <div id="bubble" class="hidden">
          <!-- Balloon and tail are one path, built by seatBubble(): a
               balloon drawn separately from its tail leaves the corner
               they share stroked on both sides and stepped where the
               two outlines cross, and no amount of overlap hides it. -->
          <svg id="bubbleShape" aria-hidden="true">
            <path id="bubbleBody" d=""></path>
            <ellipse id="bubbleSheen"></ellipse>
          </svg>
          <div id="bubbleText"><span id="bubbleLine"></span></div>
        </div>
      </div>


      <!-- screen 24: the formula stated beside the board -->
      <div id="formulaBoard" class="hidden"><div class="fb-inner"></div></div>

      <button id="nextBtn">Skip<span class="arrow">▶</span></button>

    </div>

    <!-- ============ effects ============ -->
    <!-- the hand that comes down and taps the point when nobody has
         moved for a while; positioned and shown by Hint -->

    <div id="fxLayer"></div>
    <div id="leafLayer" class="hidden"></div>

  </div>
</div>

<script src="js/config.js?v=20260916170419"></script>
<script src="js/audio.js?v=20260916170419"></script>
<script src="js/voice.js?v=20260916170419"></script>
<script src="js/fx.js?v=20260916170419"></script>
<script src="js/number-selector.js?v=20260916170419"></script>
<script src="js/triangle-options.js?v=20260916170419"></script>
<script src="js/game.js?v=20260916170419"></script>
</body>
</html>
